name: deploy (aws, frozen)

# FROZEN. This deployed the AWS stack, and it must not run again as things
# stand: the runner holds a SQLite file and an installed copy of this project,
# and the project now expects Postgres. A push that reached the runner would
# reinstall code that cannot talk to the database it has, and take the live demo
# down in the process.
#
# The stack keeps serving what it is already serving. `heroku.yml` deploys the
# real one. When the Heroku app has been watched long enough to replace this,
# delete the stack (`aws cloudformation delete-stack`) and delete this file.
#
# Left runnable by hand rather than deleted, because a frozen environment you
# cannot touch is worse than one you can — if the demo needs an emergency
# republish of the OLD interface, this is how, from the last SQLite commit.
#
# What it used to say: a push to main publishes the interface, and updates the
# stack or the checkout on the runner, but only when those actually changed.
on:
  workflow_dispatch:
    inputs:
      deploy_stack:
        description: Deploy the CloudFormation stack even if infra/ is unchanged
        type: boolean
        default: false

concurrency:
  # Two deploys racing to the same bucket and stack is how you get a site that
  # disagrees with itself. Queue instead, and never cancel a half-run deploy.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  PROJECT: moral-atlas
  ENVIRONMENT: dev

permissions:
  id-token: write     # required to request the OIDC token
  contents: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # configure-aws-credentials reports a missing role as "Could not load
      # credentials from any providers", which sends you looking for expired
      # keys that were never there. Say the actual thing instead.
      - name: Check the deploy role is configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE }}" ]; then
            echo "::error::The AWS_DEPLOY_ROLE repository variable is not set, so nothing can reach AWS. Set it to the stack's DeployRoleArn output: gh variable set AWS_DEPLOY_ROLE --body \"\$(aws cloudformation describe-stacks --stack-name moral-atlas-dev --region ap-southeast-2 --query \"Stacks[0].Outputs[?OutputKey=='DeployRoleArn'].OutputValue\" --output text)\""
            exit 1
          fi

      - id: filter
        name: Compare against the previous commit
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          # First push to a branch, a force-push, or a manual run: no usable
          # base, so treat everything as changed rather than silently skipping.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable base commit — treating everything as changed"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" '${{ github.sha }}')
          echo "$CHANGED"
          grep -qE '^infra/' <<<"$CHANGED" && I=true || I=false
          echo "infra=$I" >> "$GITHUB_OUTPUT"

  test:
    name: tests
    runs-on: ubuntu-latest

    # The suite needs a real Postgres now. There is no in-process substitute:
    # the point of the move was that the store enforces its own foreign keys and
    # refuses its own read-only writes, and a fake that did neither would pass
    # the tests that exist to check exactly that.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ATLAS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ATLAS_TEST_URL: postgresql://postgres:postgres@localhost:5432/moral_atlas_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: pytest -q

  stack:
    name: cloudformation
    needs: [changes, test]
    if: needs.changes.outputs.infra == 'true' || inputs.deploy_stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # SITE_PASSWORD is left unset on purpose: an omitted parameter keeps the
      # value the stack already has, so CI never needs to know it.
      - run: ./infra/deploy.sh
        env:
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

  site:
    name: publish site
    needs: [changes, test, stack]
    # `always()` because `stack` is skipped on most pushes, and a skipped
    # dependency would otherwise skip this too. A *failed* stack deploy still
    # stops us — publishing against a broken stack helps nobody.
    if: always() && needs.test.result == 'success' && needs.stack.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # dist/ is gitignored, so the interface only exists in CI if CI builds
      # it. Publishing without this step is what put the design screens on the
      # demo URL in place of the real thing.
      - name: Build the interface
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - run: ./infra/deploy-site.sh
        env:
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SITE_DIR: src/frontend/dist

      - name: Report the URL
        run: |
          URL=$(aws cloudformation describe-stacks \
                  --stack-name "$PROJECT-$ENVIRONMENT" \
                  --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" \
                  --output text)
          echo "### Demo → $URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

  runner:
    name: update runner
    needs: [test]
    # EVERY green push, with no path filter. There used to be one, matching
    # src/ seeds/ infra/ pyproject.toml against the PREVIOUS PUSH — which is
    # not the question. The question is whether the runner is behind, and the
    # diff since last push does not answer it: a push whose tests fail skips
    # this job, and the follow-up push that fixes the test touches only tests/,
    # matches nothing, and skips it again. The runner then sits on old code
    # while every job reports success. That happened, and the code sat stale
    # until someone thought to check the runner's HEAD by hand.
    #
    # `atlas-update` is a git pull and a pip install into an existing venv. The
    # seconds it saves on a docs-only push are not worth a deploy that lies.
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and reinstall on the runner
        run: |
          set -euo pipefail
          STACK="$PROJECT-$ENVIRONMENT"
          INSTANCE=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='RunnerInstanceId'].OutputValue" \
            --output text)

          # The idle alarm stops the runner overnight, which is the point of
          # it. A stopped instance is not a failure — there is simply nothing
          # to update, and the next boot pulls anyway.
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATE" != "running" ]; then
            echo "runner is $STATE — skipping" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # atlas-update pulls the new code and reinstalls it, and that is all
          # it does — it restarts nothing. So the API kept serving the process
          # that was already running, and a deploy could report success while
          # /api went on answering from the commit before it. Restart it here.
          #
          # `|| true` on the unit check rather than the restart: if atlas-api is
          # not installed we say so and carry on, but if it is installed and
          # fails to come back, that is a broken deploy and should fail.
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=["/usr/local/bin/atlas-update main","if systemctl list-unit-files atlas-api.service >/dev/null 2>&1 && systemctl cat atlas-api.service >/dev/null 2>&1; then systemctl restart atlas-api && sleep 3 && systemctl is-active atlas-api; else echo \"no atlas-api unit on this instance\"; fi"]' \
            --query 'Command.CommandId' --output text)

          echo "ssm command $CMD"
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE" \
            || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "$INSTANCE" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD" \
            --instance-id "$INSTANCE" --query StandardOutputContent --output text
          echo "runner update: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
        env:
          PROJECT: ${{ env.PROJECT }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
