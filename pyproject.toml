[project]
name = "moral-atlas"
version = "0.1.0"
description = "Discover the moral structure of narrative film from plot text, then project it onto a personal axis."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
analysis = ["factor-analyzer>=0.5", "pandas>=2.2"]

[project.scripts]
atlas = "moral_atlas.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
