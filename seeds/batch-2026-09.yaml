# One ingest batch, capped at 100 films.
#
# The socialist entries came from three lists the project owner supplied: an
# r/socialism_101 thread, the Freedom Socialist Party's picks, and a Letterboxd
# 'communist canon'.
#
# An earlier version of this file claimed that canon was too sparse in dialogue
# to score. That was wrong, and worth recording because of how it happened: the
# ingest report's subtitle column counts CUES, not words, and reading it as
# words made every film on the list look ten times thinner than it is. Reds
# reads 3,285 there and holds 25,470 words. Of the 29 films now in the set only
# three fall under 3,000 words, and all three are silent films — which is what
# silent film does, not a property of the politics.
