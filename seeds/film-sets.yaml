  - id: hollywood-pre-1950
    name: "American film before 1950"
    colour: "#c2a878"
    source: "Assembled from corpus metadata: United States, English language"
    description: "The studio era, before television and the collapse of the Production Code."
    rule:
      country: 'United States'
      language: 'English'
      year_max: 1949
  - id: hollywood-1950-1989
    name: "American film 1950–1989"
    colour: "#86b57f"
    source: "Assembled from corpus metadata: United States, English language"
    description: "From the studio system's decline through New Hollywood and the blockbuster."
    rule:
      country: 'United States'
      language: 'English'
