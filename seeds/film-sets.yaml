    url: "https://letterboxd.com/kilo_orange/list/the-best-conservative-movies-according-to/"
    description: "Films a mainstream conservative magazine named as conservative in spirit."
    titles:
      - "300"
      - "Braveheart"
      - "Ghostbusters"
      - "Gran Torino"
      - "Groundhog Day"
      - "Master and Commander: The Far Side of the World"
