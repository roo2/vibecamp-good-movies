# Named groups of films, so the atlas can ask where a worldview sits.
#
# Every set carries its SOURCE. A set is somebody's claim about which films
# belong together, and an unattributed one is indistinguishable from a list
# invented to make the axes look good. Sets assembled from corpus metadata
# say so; sets taken from a published list name it.
#
# Titles are resolved against the corpus at load time and anything absent is
# reported rather than dropped silently, because coverage IS the caveat: the
# Church of Satan list matched 4 of 86.
