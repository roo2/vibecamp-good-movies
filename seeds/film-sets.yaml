  # Two advocacy bodies that name films for how they DEPICT a group, decade after
  # decade, rather than for craft. That is the property that matters here: the
  # lists which separate on these axes are the ones assembled by applying a
  # standard film by film, and a body handing out an award every year since 1991
  # is doing exactly that. Winners and nominees both, because winners alone leave
  # too few films in a corpus enumerated by notability.
  #
  # A representation-GRADING source was tried first and failed — Mediaversity's
  # letter grades for gender, race and LGBTQ portrayal produced nine corpus films
  # that did not separate at all. These two cover the same subject matter and do
  # separate, so the difference is the instrument: what a film is ABOUT is not
  # what its cast is.
  - id: glaad-lgbtq
    name: "LGBTQ (GLAAD-honoured)"
    colour: "#8a5cf0"
    source: "GLAAD Media Award for Outstanding Film – Wide Release, winners and nominees, 1991 onward"
    url: "https://en.wikipedia.org/wiki/GLAAD_Media_Award_for_Outstanding_Film_%E2%80%93_Wide_Release"
    description: "Films an LGBTQ advocacy body named for their depiction of LGBTQ characters and themes. On 18 placed films it separates from the corpus only marginally (F = 5.5 with the calendar regressed out, against a null of 5.3), but it points where the feminist list points — the two centres agree at cosine 0.98 and sit 0.31 SD apart."
    titles:
      - "Alexander"
      - "As Good as It Gets"
      - "Billy Elliot"
      - "Brokeback Mountain"
      - "Call Me by Your Name"
      - "Deadpool 2"
      - "Eternals"
      - "Everything Everywhere All at Once"
      - "Lady Bird"
      - "Milk"
      - "Moonlight"
      - "Philadelphia"
      - "Pride"
      - "The Hours"
      - "The Imitation Game"
      - "The Mitchells vs. The Machines"
