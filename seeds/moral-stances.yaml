# The moral positions a person can choose, and the faces that stand for them.
#
# WHY CHOSEN AND NOT INFERRED. A position read off somebody's ratings is mostly
# their taste wearing moral labels. Placing 160,952 MovieLens raters twice, from
# disjoint halves of the films they liked, the three axes agree at 0.54 / 0.24 /
# 0.04 — and once taste is residualised out of the film positions, 0.08 / 0.12 /
# -0.06. There is no honest way to read this off what somebody watches. Asking
# is not a fallback; it is the only clean instrument.
#
# WHY A CHARACTER AND NOT A QUESTION. The propositions these axes are built from
# are abstract by construction, and a survey of them is what people abandon: of
# forty submissions, twenty-four answered nothing. A face and a sentence are one
# tap, and the sentence is close to a proposition the axis is actually made of.
#
# THE POSITION IS THE SET'S CENTRE, NOT THE CHARACTER'S FILM. Wonder Woman sits
# only -0.17 along self-determination, well short of her canon's -0.43, and
# Joker at -1.75 / +2.27 is far past the red-pilled centre rather than at it. The
# character is a signpost people recognise; the coordinates come from the whole
# canon behind it, so recognisability and typicality stop competing.
#
# WHY THESE THREE. Measured in units of each set's own internal spread, the
# centres are 2.11 (red-pilled to christian), 1.88 (red-pilled to feminist) and
# 1.39 (christian to feminist) apart — three distinct corners. Two sets that were
# considered are deliberately absent: progressive-canon sits 0.06 from feminist,
# and church-of-satan 0.68 from red-pilled. Offering either as a fourth option
# would ask people to distinguish positions the instrument cannot.
#
# A CHARACTER IMAGE, NOT THE POSTER, where one can be found. A poster sells a
# film and is mostly title treatment; this screen is asking which PERSON speaks
# to somebody, so it should show the person. `image_url` overrides the film's
# artwork when it is set, and the poster is the fallback rather than the intent.
# Wikipedia is the same source the film artwork already comes from, but its
# character articles usually lead with a montage of every incarnation, which is
# worse than a poster for this — each one below was looked at before it was
# kept, and only Mufasa's came back as a single clean figure.
#
# THE POSITIONS ARE NAMED. An earlier version showed only the claim and the face
# and named nothing, on the reasoning that nobody should be asked to wear a
# label. It made the screen ambiguous instead of gentle: three quotes with no
# frame do not tell somebody they are being asked about MORALITY, and this
# product measures two different things about a film, so leaving the reader to
# infer which one is being asked about is the worse failure.
#
# The labels are chosen to be recognisable without being factional:
#
# Listed most-affirming first, so the screen does not open on the bleakest of
# the three. Nothing downstream depends on the order.
#
#   Traditional  the Christian canon — redemption, and an order above the
#                individual. +0.72 and +0.67 on those two axes.
#   Progressive  the feminist canon — self-determination, at -0.43. Note this is
#                a MORE honest name than "feminist" was: the feminist and
#                progressive canons sit 0.06 apart, so the narrower word was
#                claiming a precision the instrument does not have.
#   Cynical      the red-pilled canon. Named from where it actually sits rather
#                than from the subculture: -1.18 on inevitable ruin against
#                redemption, further from the centre than anything else about it.
#                "Red pill" and "sigma" name a faction and pick a fight; cynical
#                names the belief, is understood by everyone, and is something
#                people call themselves without flinching.

