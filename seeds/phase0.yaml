# Phase 0 seed corpus — 50 films.
#
# Chosen for three things at once:
#   1. The split-case battery (note: battery) — films the space MUST separate.
#      If these collapse together the ontology is broken, so they go in first.
#   2. Spread across era (1939-2024), country, and register, so any factor that
#      is really "is this a modern American prestige picture" shows itself.
#   3. Documentation depth — all should carry a full Wikipedia plot section, and
#      most a themes/analysis section, which is what phase 0 is testing.
#
# Fifty films: the original spread plus ten the intended audience has actually
# seen. Widely-recognised titles were added rather than substituted, because
# dropping the arthouse and non-anglophone half would have cost exactly the
# variation that lets a confound show itself — with only mainstream anglophone
# cinema in the corpus, "this axis is a feature of narrative film" and "this
# axis is a feature of Hollywood" cannot be told apart.
#
# The cost of keeping both is scoring: fifty films rather than forty, against
# the same bank.
#
# `wikipedia` overrides the article title where the plain title is ambiguous.

films:
