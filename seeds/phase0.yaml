# Phase 0 seed corpus — 40 films.
#
# Chosen for three things at once:
#   1. The split-case battery (note: battery) — films the space MUST separate.
#      If these collapse together the ontology is broken, so they go in first.
#   2. Spread across era (1939-2022), country, and register, so any factor that
#      is really "is this a modern American prestige picture" shows itself.
#   3. Documentation depth — all should carry a full Wikipedia plot section, and
#      most a themes/analysis section, which is what phase 0 is testing.
#
# Revised to films the intended audience has actually seen. Ten arthouse and
# mid-century titles — Rashomon, Tokyo Story, Seven Samurai, Bicycle Thieves,
# A Man for All Seasons, Chariots of Fire, Do the Right Thing, Les Misérables,
# V for Vendetta, A Separation — gave way to ten widely-seen ones. That is a
# real cost to the spread: what left was most of the non-anglophone corpus and
# most of the pre-1960 arthouse, so any claim that an axis is universal rather
# than a feature of mainstream anglophone cinema is now much weaker, and the
# `origin_country` confound has less to bite on. It buys audience recognition,
# which the product needs more than the paper does.
#
# `wikipedia` overrides the article title where the plain title is ambiguous.

films:
