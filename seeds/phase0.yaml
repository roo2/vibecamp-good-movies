# Phase 0 seed corpus — 40 films.
#
# Chosen for three things at once:
#   1. The split-case battery (note: battery) — films the space MUST separate.
#      If these collapse together the ontology is broken, so they go in first.
#   2. Spread across era (1942-2024), country, and register, so any factor that
#      is really "is this a modern American prestige picture" shows itself.
#   3. Documentation depth — all should carry a full Wikipedia plot section, and
#      most a themes/analysis section, which is what phase 0 is testing.
#
# `wikipedia` overrides the article title where the plain title is ambiguous.

films:
  # ---- split-case battery ----
  - title: "The Lion King"
    year: 1994  
    note: battery
  - title: "Maleficent"
    year: 2014  
    note: battery
  - title: "The Lord of the Rings: The Return of the King"
